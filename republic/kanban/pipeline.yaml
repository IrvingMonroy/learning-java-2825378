# Republic v1 — Kanban pipeline definition (SPEC §21)
# Chat = interaction. Kanban = state.
# This file is the single place thresholds live. Skills read it; they never invent numbers.

version: 1.0.0
board: republic

columns:
  - id: TRIAGE
    owner: republic-triage
    entry: intake item registered from CONTENT_DROP/ or a Socrates request
    exit: card typed (content | search | paid | knowledge | ops), brand set, objective hypothesis set
  - id: RESEARCH
    owner: republic-research
    exit: one Research Brief attached (never one per platform)
  - id: STRATEGY
    owner: republic (orchestrator)
    exit: objective fixed (BRAND WRITING | DIRECT RESPONSE), target platforms chosen, core content object defined
  - id: PLATFORM_BRIEF
    owner: republic-platform-experts
    exit: one native brief per target platform
  - id: PRODUCTION
    owner: republic-editing | republic-hyperframes | republic-writing-system
    exit: rendered assets and copy attached; Writing QA passed
  - id: QA
    owner: republic-qa
    exit: verdict PASS, or FAIL with BLOCKER/DEFECT list (card returns to the owning column)
  - id: RACHEL_APPROVAL
    owner: rachel
    gate: true
    exit: rachel approves (→ SCHEDULED) or returns with a note (→ owning column)
  - id: SCHEDULED
    owner: republic-distribution
    exit: GHL Social Planner IDs recorded on the card
  - id: PUBLISHED
    owner: republic-distribution
    exit: GHL confirms publish; live URLs recorded
  - id: MEASURED
    owner: republic-learning-loop
    exit: metrics captured at measurement_window; evidence note filed with Librarian
  - id: DONE
    owner: republic-kanban
    terminal: true

# Only these actors may move a card OUT of a gate column.
gates:
  RACHEL_APPROVAL:
    may_advance: [rachel]
    may_return: [rachel]
  paid_spend:
    # SPEC §16: "Rachel approval for meaningful spend/change". Default until Rachel sets it.
    # Any single change at or above either threshold requires a RACHEL_APPROVAL card.
    absolute_usd: 50
    relative_pct: 20
    autonomous_allowed: false

# SPEC §26: a pattern becomes canonical brand knowledge only after sufficient evidence.
learning:
  min_sample: 12            # minimum published items sharing the attribute under test
  measurement_window_days: 7
  canonical_requires: rachel_ack   # Librarian proposes; Rachel acknowledges before canonical: true

# Card type → default column path. Non-content jobs skip stages they don't need.
paths:
  content:   [TRIAGE, RESEARCH, STRATEGY, PLATFORM_BRIEF, PRODUCTION, QA, RACHEL_APPROVAL, SCHEDULED, PUBLISHED, MEASURED, DONE]
  search:    [TRIAGE, RESEARCH, QA, RACHEL_APPROVAL, DONE]
  paid:      [TRIAGE, RESEARCH, STRATEGY, QA, RACHEL_APPROVAL, DONE]
  knowledge: [TRIAGE, DONE]
  ops:       [TRIAGE, QA, RACHEL_APPROVAL, DONE]

# Worker tiers, never model IDs (SPEC §23). Resolution lives in the model-routing skill.
workers:
  local:    "T0 — local free tier (routine transforms, tagging, cleanup, summaries)"
  frontier: "T1 — frontier session (brand voice, strategy, judgment, code)"
  metered:  "T1a — metered API, only within model-routing guardrails"
